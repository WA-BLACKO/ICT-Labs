<!DOCTYPE html>
<html lang="en">
<head>
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"
> 
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - ICT Lab</title>

    <link rel="stylesheet" href="CSSMain.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #102442,
                    #07111f 55%
                );

            color: #eaf5ff;
        }


        .profile-page {

            width:
                min(100% - 32px, 760px);

            margin:
                40px auto;

        }


        .back-link {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            margin-bottom:
                22px;

            color:
                #a9bfd4;

            text-decoration:
                none;

            font-size:
                14px;

        }


        .back-link:hover {
            color:
                #6ee7d8;
        }


        .profile-card {

            padding:
                32px;

            border-radius:
                24px;

            background:
                rgba(255,255,255,.04);

            border:
                1px solid
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(18px);

            box-shadow:
                0 25px 60px
                rgba(0,0,0,.25);

        }


        .profile-title {

            margin:
                0 0 28px;

            font-size:
                34px;

        }


        .profile-avatar-editor {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            gap:
                14px;

            margin-bottom:
                30px;

        }


        .profile-avatar-preview {

            width:
                110px;

            height:
                110px;

            display:
                grid;

            place-items:
                center;

            border-radius:
                50%;

            overflow:
                hidden;

            font-size:
                32px;

            font-weight:
                800;

            color:
                #071821;

            background:
                linear-gradient(
                    135deg,
                    #6ee7d8,
                    #7b9cff
                );

            border:
                3px solid
                rgba(255,255,255,.12);

        }


        .profile-avatar-preview img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

        }


        .profile-avatar-actions {

            display:
                flex;

            gap:
                10px;

            flex-wrap:
                wrap;

            justify-content:
                center;

        }


        .avatar-btn {

            padding:
                10px 14px;

            border-radius:
                10px;

            border:
                1px solid
                rgba(255,255,255,.10);

            background:
                rgba(255,255,255,.04);

            color:
                #d9e8f5;

            cursor:
                pointer;

        }


        .form-group {

            margin-bottom:
                20px;

        }


        .form-group label {

            display:
                block;

            margin-bottom:
                8px;

            color:
                #a9bfd4;

            font-size:
                14px;

        }


        .form-group input,
        .form-group select,
        .form-group textarea {

            width:
                100%;

            box-sizing:
                border-box;

            padding:
                13px 14px;

            border-radius:
                12px;

            border:
                1px solid
                rgba(255,255,255,.10);

            background:
                rgba(255,255,255,.04);

            color:
                #ffffff;

            outline:
                none;

            font-size:
                15px;

        }


        .form-group textarea {

            min-height:
                110px;

            resize:
                vertical;

        }


        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            border-color:
                rgba(110,231,216,.55);

        }


        .save-btn {

            width:
                100%;

            padding:
                14px;

            border:
                none;

            border-radius:
                12px;

            font-size:
                15px;

            font-weight:
                700;

            cursor:
                pointer;

            color:
                #07111f;

            background:
                linear-gradient(
                    135deg,
                    #6ee7d8,
                    #7b9cff
                );

        }


        .save-message {

            margin-top:
                14px;

            text-align:
                center;

            color:
                #6ee7d8;

            min-height:
                22px;

        }


    </style>

</head>


<body>

<div class="profile-page">

   


    <div class="profile-card">

        <h1 class="profile-title">
            My Profile
        </h1>


        <form id="profileForm">


            <div class="profile-avatar-editor">

                <div
                    class="profile-avatar-preview"
                    id="profileAvatarPreview"
                >
                    NS
                </div>


                <div class="profile-avatar-actions">

                    <label class="avatar-btn">

                        Upload Photo

                        <input
                            type="file"
                            id="profileImageInput"
                            accept="image/*"
                            hidden
                        >

                    </label>


                    <button
                        type="button"
                        class="avatar-btn"
                        id="useInitialsBtn"
                    >
                        Use Initials
                    </button>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    id="displayName"
                    placeholder="Your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    School
                </label>

                <input
                    type="text"
                    id="school"
                    placeholder="Your school"
                >

            </div>


            <div class="form-group">

                <label>
                    Education Status
                </label>

                <select id="educationStatus">

                    <option value="">
                        Select status
                    </option>

                    <option value="school">
                        Still studying at school
                    </option>

                    <option value="al">
                        Preparing for A/Ls
                    </option>

                    <option value="university">
                        University / Higher Education
                    </option>

                    <option value="completed">
                        Finished school
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Bio
                </label>

                <textarea
                    id="bio"
                    maxlength="300"
                    placeholder="Write something about yourself..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="save-btn"
            >
                Save Changes
            </button>


            <div
                id="saveMessage"
                class="save-message"
            ></div>


        </form>

    </div>

</div>




<!-- =====================================
     PROFILE PICTURE CROP WINDOW
===================================== -->

<div class="crop-modal" id="cropModal">

    <div class="crop-window">

        <div class="crop-header">

            <div>
                <h2>Adjust your photo</h2>
                <p>Move and zoom the photo until it looks right.</p>
            </div>

            <button
                type="button"
                class="crop-close"
                id="cropClose"
            >
                ×
            </button>

        </div>


        <div class="crop-area">

            <img
                id="cropImage"
                alt="Profile picture"
            >

        </div>


        <div class="crop-controls">

            <span>−</span>

            <input
                type="range"
                id="cropZoom"
                min="0"
                max="1"
                step="0.01"
                value="0"
            >

            <span>+</span>

        </div>


        <div class="crop-actions">

            <button
                type="button"
                class="crop-cancel"
                id="cropCancel"
            >
                Cancel
            </button>


            <button
                type="button"
                class="crop-save"
                id="cropSave"
            >
                Use Photo
            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>





<script>

const profileForm =
    document.getElementById("profileForm");

const displayName =
    document.getElementById("displayName");

const school =
    document.getElementById("school");

const educationStatus =
    document.getElementById("educationStatus");

const bio =
    document.getElementById("bio");

const profileImageInput =
    document.getElementById("profileImageInput");

const profileAvatarPreview =
    document.getElementById("profileAvatarPreview");

const useInitialsBtn =
    document.getElementById("useInitialsBtn");

const saveMessage =
    document.getElementById("saveMessage");


let profileImage = null;


/* -----------------------------
   CREATE INITIALS
----------------------------- */

function getInitials(name) {

    if (!name) {
        return "U";
    }

    return name
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(word => word.charAt(0))
        .join("")
        .toUpperCase();

}


/* -----------------------------
   UPDATE INITIALS
----------------------------- */

displayName.addEventListener(
    "input",
    function () {

        if (!profileImage) {

            profileAvatarPreview.textContent =
                getInitials(
                    displayName.value
                );

        }

    }
);


/* -----------------------------
   UPLOAD IMAGE
----------------------------- */

const cropModal =
    document.getElementById("cropModal");

const cropImage =
    document.getElementById("cropImage");

const cropSave =
    document.getElementById("cropSave");

const cropCancel =
    document.getElementById("cropCancel");

const cropClose =
    document.getElementById("cropClose");

const cropZoom =
    document.getElementById("cropZoom");


let cropper = null;


/* =========================
   SELECT PROFILE PHOTO
========================= */

profileImageInput.addEventListener(
    "change",
    function (event) {

        const file =
            event.target.files[0];

        if (!file) return;


        if (!file.type.startsWith("image/")) {

            alert("Please choose an image.");

            profileImageInput.value = "";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function (e) {

                cropImage.src =
                    e.target.result;

                cropModal.classList.add(
                    "active"
                );


                if (cropper) {
                    cropper.destroy();
                }


                cropper =
                    new Cropper(
                        cropImage,
                        {
                            aspectRatio: 1,

                            viewMode: 1,

                            dragMode: "move",

                            autoCropArea: 1,

                            background: false,

                            responsive: true,

                            guides: false,

                            center: true,

                            movable: true,

                            zoomable: true,

                            scalable: false,

                            rotatable: false
                        }
                    );

            };


        reader.readAsDataURL(file);

    }
);


/* =========================
   USE CROPPED PHOTO
========================= */

cropSave.addEventListener(
    "click",
    function () {

        if (!cropper) return;


        const canvas =
            cropper.getCroppedCanvas({
                width: 400,
                height: 400,

                imageSmoothingEnabled: true,
                imageSmoothingQuality: "high"
            });


        profileImage =
            canvas.toDataURL(
                "image/jpeg",
                0.88
            );


        profileAvatarPreview.innerHTML = "";


        const image =
            document.createElement("img");


        image.src =
            profileImage;

        image.alt =
            "Profile picture";


        profileAvatarPreview.appendChild(
            image
        );


        closeCropper();

    }
);


/* =========================
   CANCEL
========================= */

cropCancel.addEventListener(
    "click",
    closeCropper
);


cropClose.addEventListener(
    "click",
    closeCropper
);


function closeCropper() {

    cropModal.classList.remove(
        "active"
    );


    if (cropper) {

        cropper.destroy();

        cropper = null;

    }


    cropZoom.value = 0;

}


/* =========================
   ZOOM CONTROL
========================= */

cropZoom.addEventListener(
    "input",
    function () {

        if (!cropper) return;


        const value =
            Number(this.value);


        cropper.zoomTo(
            1 + value * 2
        );

    }
); 


/* -----------------------------
   USE INITIALS
----------------------------- */

useInitialsBtn.addEventListener(
    "click",
    function () {

        profileImage =
            null;

        profileImageInput.value =
            "";

        profileAvatarPreview.textContent =
            getInitials(
                displayName.value
            );

    }
);


/* -----------------------------
   SAVE PROFILE
----------------------------- */

profileForm.addEventListener("submit", function (event) {

    event.preventDefault();

    const profileData = {
        name: displayName.value.trim(),
        school: school.value.trim(),
        status: educationStatus.value,
        bio: bio.value.trim(),
        avatar: profileImage
    };

    // Save profile
    localStorage.setItem(
        "ictLabProfile",
        JSON.stringify(profileData)
    );

    saveMessage.textContent =
        "Profile saved successfully ✓";

    // Automatically return to ICT Lab
    setTimeout(function () {

        window.location.href = "index.html";

    }, 700);

}); 

/* -----------------------------
   LOAD PROFILE
----------------------------- */

function loadProfile() {

    const savedProfile =
        localStorage.getItem(
            "ictLabProfile"
        );


    if (!savedProfile) {
        return;
    }


    const data =
        JSON.parse(savedProfile);


    displayName.value =
        data.name || "";

    school.value =
        data.school || "";

    educationStatus.value =
        data.status || "";

    bio.value =
        data.bio || "";


    if (data.avatar) {

        profileImage =
            data.avatar;

        profileAvatarPreview.innerHTML =
            `<img src="${data.avatar}" alt="Profile picture">`;

    }

    else {

        profileAvatarPreview.textContent =
            getInitials(
                data.name
            );

    }

}


loadProfile();

</script>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>

</body>
</html>
